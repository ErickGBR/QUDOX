# ============================================================================
# QUDOX — nginx del frontend: sirve `dist/` y proxyea la API al backend
# El navegador solo habla con ESTE puerto (mismo origen): `/api/...` se
# reenvía a `http://backend:3000` (nombre de servicio de compose) y el resto
# cae al SPA (`index.html` para el enrutado de cliente).
# ============================================================================
server {
    listen 80;
    server_name _;

    # Estáticos del build de Vite.
    root /usr/share/nginx/html;
    index index.html;

    # API: proxy al backend (conserva el prefijo /api que el backend espera).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chequeo de proceso del backend, también accesible por mismo origen.
    location = /health {
        proxy_pass http://backend:3000;
    }

    # SPA: cualquier otra ruta sirve index.html (enrutado de cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
